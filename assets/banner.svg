<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="TasinLunatic — Full Stack Developer and Intern">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- panel background -->
  <rect width="1200" height="320" fill="#0d1117"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#scan)"/>
  <rect x="1" y="1" width="1198" height="318" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- cyberpunk corner brackets -->
  <g stroke="#22d3ee" stroke-width="3" fill="none" filter="url(#glowSoft)">
    <path d="M 22 22 h 40 M 22 22 v 40"/>
    <path d="M 1178 22 h -40 M 1178 22 v 40"/>
    <path d="M 22 298 h 40 M 22 298 v -40"/>
    <path d="M 1178 298 h -40 M 1178 298 v -40"/>
  </g>

  <!-- left content -->
  <text x="58" y="68" fill="#8b949e" font-size="17" letter-spacing="3">~/github/tasinlunatic</text>

  <text x="54" y="152" fill="#e6edf3" font-size="62" font-weight="700" letter-spacing="3" filter="url(#glow)">TasinLunatic</text>
  <rect x="536" y="110" width="30" height="52" fill="#22d3ee" filter="url(#glowSoft)"/>

  <text x="58" y="192" fill="#a78bfa" font-size="21" letter-spacing="5" filter="url(#glowSoft)">FULL STACK DEVELOPER // INTERN</text>

  <!-- info chips -->
  <g font-size="16">
    <rect x="58" y="216" width="120" height="32" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="118" y="237" fill="#3ddc84" text-anchor="middle">@bongoDev</text>
    <rect x="190" y="216" width="100" height="32" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="240" y="237" fill="#22d3ee" text-anchor="middle">dhaka</text>
    <rect x="302" y="216" width="110" height="32" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="357" y="237" fill="#8b949e" text-anchor="middle">est. 2023</text>
  </g>

  <!-- right: mini status terminal -->
  <g>
    <rect x="776" y="66" width="366" height="188" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="776" y="66" width="366" height="36" rx="10" fill="#21262d"/>
    <rect x="776" y="82" width="366" height="20" fill="#21262d"/>
    <circle cx="800" cy="84" r="6" fill="#f85149"/>
    <circle cx="822" cy="84" r="6" fill="#d29922"/>
    <circle cx="844" cy="84" r="6" fill="#3fb950"/>
    <text x="959" y="90" fill="#8b949e" font-size="14" text-anchor="middle">status: live</text>

    <text x="800" y="142" fill="#3ddc84" font-size="16" font-weight="700">$</text>
    <text x="814" y="142" fill="#e6edf3" font-size="16">build --target portfolio</text>
    <text x="800" y="174" fill="#22d3ee" font-size="15">[ok] interface   [ok] logic</text>
    <text x="800" y="204" fill="#22d3ee" font-size="15">[ok] deploy — ship it</text>

    <rect x="800" y="222" width="312" height="12" rx="6" fill="#21262d" stroke="#30363d"/>
    <rect x="800" y="222" width="265" height="12" rx="6" fill="#22d3ee" filter="url(#glowSoft)"/>
    <text x="800" y="252" fill="#8b949e" font-size="13">next release: v2.0 — soon</text>
  </g>
</svg>
