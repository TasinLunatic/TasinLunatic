<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Simulated terminal panel introducing Tasin">
  <defs>
    <filter id="glowSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- window -->
  <rect width="1120" height="600" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- title bar -->
  <rect width="1120" height="46" rx="12" fill="#161b22"/>
  <rect y="24" width="1120" height="22" fill="#161b22"/>
  <circle cx="30" cy="23" r="7" fill="#f85149"/>
  <circle cx="54" cy="23" r="7" fill="#d29922"/>
  <circle cx="78" cy="23" r="7" fill="#3fb950"/>
  <text x="560" y="31" fill="#8b949e" font-size="16" text-anchor="middle">tasin@bongodev: ~ — presentation only</text>

  <!-- body -->
  <g font-size="20">
    <text x="46" y="98" fill="#3ddc84" font-weight="700">$</text>
    <text x="72" y="98" fill="#e6edf3">whoami</text>
    <text x="46" y="134" fill="#22d3ee">› tasin — full stack developer · intern @ bongoDev</text>

    <text x="46" y="182" fill="#3ddc84" font-weight="700">$</text>
    <text x="72" y="182" fill="#e6edf3">cat interests.txt</text>
    <text x="46" y="218" fill="#22d3ee">› web technologies · clean interfaces · learning new tools</text>

    <text x="46" y="266" fill="#3ddc84" font-weight="700">$</text>
    <text x="72" y="266" fill="#e6edf3">cat currently.txt</text>
    <text x="46" y="302" fill="#a78bfa">› building: campus &amp; community web apps</text>
    <text x="46" y="334" fill="#a78bfa">› learning: node.js · backend engineering</text>

    <text x="46" y="382" fill="#3ddc84" font-weight="700">$</text>
    <text x="72" y="382" fill="#e6edf3">cat principles.txt</text>
    <text x="46" y="418" fill="#3ddc84">› break the problem → learn the tool → build → ship</text>
  </g>

  <!-- progress -->
  <text x="46" y="470" fill="#3ddc84" font-weight="700" font-size="20">$</text>
  <text x="72" y="470" fill="#e6edf3" font-size="20">./ship --next-project</text>
  <rect x="46" y="492" width="440" height="18" rx="9" fill="#21262d" stroke="#30363d"/>
  <rect x="46" y="492" width="374" height="18" rx="9" fill="#22d3ee" filter="url(#glowSoft)"/>
  <text x="502" y="507" fill="#e6edf3" font-size="16">85%</text>

  <!-- final prompt -->
  <text x="46" y="556" fill="#3ddc84" font-weight="700" font-size="20">$</text>
  <rect x="72" y="538" width="18" height="24" fill="#22d3ee" filter="url(#glowSoft)"/>
</svg>
